<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Useless - Landing Page</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Piccolo CSS per conferma */
    .confirmation {
      opacity: 0;
      transition: opacity 0.3s;
      color: green;
      margin-top: 10px;
    }
    .confirmation.show {
      opacity: 1;
    }
    .confirmation.error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-wrapper">
      <h1 class="fade-in">Useless</h1>
      <p class="subtitle fade-in">Unlock Your Focus</p>

      <form id="waitlistForm" class="slide-up">
        <input type="text" id="firstName" name="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" name="lastName" placeholder="Last Name" required>
        <input type="email" id="email" name="email" placeholder="Email" required>
        <button type="submit" class="cta">Join Waitlist</button>
      </form>

      <p id="confirmation" class="confirmation"></p>

      <p class="description fade-in">
        Discover the ultimate focus and productivity app powered by AI.
      </p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('waitlistForm');
      const confirmation = document.getElementById('confirmation');
      const submitButton = form.querySelector('button[type="submit"]');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitButton.disabled = true;

        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        try {
          const response = await fetch('https://sheetdb.io/api/v1/hbtktc66picgv', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data })
          });

          if (response.ok) {
            confirmation.textContent = "You’ve been added to the waitlist! 🎉";
            confirmation.classList.add('show');
            form.reset();

            setTimeout(() => {
              confirmation.classList.remove('show');
              submitButton.disabled = false;
            }, 5000);
          } else {
            throw new Error('Failed to submit');
          }
        } catch (error) {
          confirmation.textContent = "Oops! Something went wrong. 😅";
          confirmation.classList.add('show', 'error');

          setTimeout(() => {
            confirmation.classList.remove('show', 'error');
            submitButton.disabled = false;
          }, 5000);
        }
      });
    });
  </script>
</body>
</html>
