<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Useless - Landing Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="form-wrapper">
      <h1 class="fade-in">Useless</h1>
      <p class="subtitle fade-in">Unlock Your Focus</p>

      <form id="waitlistForm" class="slide-up">
        <input type="text" id="firstName" name="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" name="lastName" placeholder="Last Name" required>
        <input type="email" id="email" name="email" placeholder="Email" required>
        <button type="submit" class="cta">Join Waitlist</button>
      </form>

      <p id="confirmation" class="confirmation"></p>

      <p class="description fade-in">
        Discover the ultimate focus and productivity app powered by AI.
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
